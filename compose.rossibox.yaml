# Nur der Server — gegen die vorhandene Datenbank auf der rossibox (Template postgresql18, Host-Port 7432).
# Aufruf auf der rossibox im Checkout:  docker compose -f compose.rossibox.yaml up --build -d
# Passwort in .env (JOURNALI_DB_PASSWORD), siehe .env.example. Danach http://rossibox:8080
services:
  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      JOURNALI_DB: Host=localhost;Port=7432;Database=journali;Username=postgres
      JOURNALI_DB_PASSWORD: ${JOURNALI_DB_PASSWORD}
      # Medien: postgres = Tabelle media_blob in derselben Datenbank — dann sehen PC und Container dasselbe.
      # Umstellen jederzeit unter ⚙ Einstellungen → ▨ Storage (media.json im Volume journali-jobs).
      JOURNALI_MEDIA: postgres
      JOURNALI_JOBS: /data/jobs
    volumes:
      - journali-jobs:/data/jobs
      - ./plugins:/app/plugins
      # ein Bind-Mount ueberdeckt auch die node_modules aus dem Image — diese zwei Plugins brauchen Pakete
      - journali-derive-modules:/app/plugins/derive/node_modules
      - journali-docs-modules:/app/plugins/docs/node_modules
    restart: unless-stopped

volumes:
  journali-jobs:
  journali-derive-modules:
  journali-docs-modules:
