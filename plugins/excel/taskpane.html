<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>journali</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root { color-scheme: light dark; --line: #d8dbe0; --muted: #6b7280; --accent: #2563eb; --pos: #15803d; --neg: #b91c1c; --bg: #f3f4f6; }
    @media (prefers-color-scheme: dark) { :root { --line: #2c323b; --muted: #8b93a0; --accent: #5b9cff; --pos: #4ade80; --neg: #f87171; --bg: #1a1e24; } }
    body { font: 13px/1.4 system-ui, "Segoe UI", sans-serif; margin: 0; padding: 10px; }
    h1 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
    label { display: block; color: var(--muted); font-size: 12px; margin-top: 8px; }
    input, select, button { font: inherit; }
    input[type=text], input[type=search], select { width: 100%; box-sizing: border-box; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; }
    button { padding: 5px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); cursor: pointer; margin-top: 8px; }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button:disabled { opacity: .5; cursor: default; }
    .row { display: flex; gap: 6px; align-items: center; }
    .muted { color: var(--muted); font-size: 12px; }
    .hits { border: 1px solid var(--line); border-radius: 4px; max-height: 160px; overflow: auto; margin-top: 4px; }
    .hit { padding: 4px 6px; cursor: pointer; border-bottom: 1px solid var(--line); }
    .hit:hover { background: var(--bg); }
    .hit.on { background: var(--accent); color: #fff; }
    .log { font: 11px ui-monospace, Consolas, monospace; color: var(--muted); margin-top: 10px; white-space: pre-wrap; max-height: 200px; overflow: auto; }
    .pos { color: var(--pos); } .neg { color: var(--neg); }
    kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; }
  </style>
</head>
<body>
  <h1><img src="/logo-32.png" width="18" height="18" alt="" /> journali <span id="status" class="muted"></span></h1>

  <label>👤 Name (Urheber im Journal)</label>
  <input id="actor" type="text" placeholder="dein Name" />

  <label>🔍 Knoten</label>
  <input id="q" type="search" placeholder="Name, SKU, Id — ab 2 Zeichen" autocomplete="off" />
  <div id="hits" class="hits" hidden></div>
  <div id="picked" class="muted"></div>

  <div class="row">
    <div style="flex:1"><label>Zeilen</label>
      <select id="mode"><option value="children">Subitems</option><option value="variants">alle Varianten darunter</option><option value="products">alle Produkte darunter</option></select></div>
    <div style="flex:1"><label>Sprache</label><select id="locale"></select></div>
  </div>
  <label>Spalten (Sicht)</label>
  <select id="view"><option value="">◫ alle Attribute</option></select>

  <div class="row">
    <button id="load" class="primary" disabled>⇩ ins Blatt laden</button>
    <button id="save" disabled>💾 Geändertes speichern</button>
    <button id="reload" disabled title="Blatt neu laden — eigene Änderungen gehen verloren">↻</button>
  </div>
  <div class="muted" style="margin-top:8px">Zeile 1 = Schlüssel (nicht ändern), Zeile 2 = Namen, Spalte A = Id. <i>Kursiv</i> = geerbt. Speichern schreibt nur Zellen, die sich seit dem Laden geändert haben — als ein Stapel.</div>
  <div id="log" class="log"></div>

  <script src="taskpane.js"></script>
</body>
</html>
