<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>journali</title>
  <script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
  <script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins-ui.js"></script>
  <link rel="stylesheet" href="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.css" />
  <style>
    body { font: 12px/1.4 system-ui, "Segoe UI", sans-serif; margin: 0; padding: 8px; color: #333; }
    label { display: block; color: #777; font-size: 11px; margin-top: 8px; }
    input, select, button { font: inherit; }
    input[type=text], input[type=search], select { width: 100%; box-sizing: border-box; padding: 4px 6px; border: 1px solid #ccc; border-radius: 3px; }
    button { padding: 5px 10px; border: 1px solid #ccc; border-radius: 3px; background: #f3f4f6; cursor: pointer; margin-top: 8px; }
    button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
    button:disabled { opacity: .5; cursor: default; }
    .row { display: flex; gap: 6px; align-items: center; }
    .muted { color: #777; font-size: 11px; }
    .hits { border: 1px solid #ccc; border-radius: 3px; max-height: 150px; overflow: auto; margin-top: 4px; }
    .hit { padding: 4px 6px; cursor: pointer; border-bottom: 1px solid #eee; }
    .hit:hover { background: #eef2f7; }
    .log { font: 11px ui-monospace, Consolas, monospace; color: #777; margin-top: 8px; white-space: pre-wrap; max-height: 180px; overflow: auto; }
    .pos { color: #15803d; } .neg { color: #b91c1c; }
  </style>
</head>
<body>
  <div class="row"><b>journali</b> <span id="status" class="muted"></span></div>
  <label>Server</label>
  <input id="server" type="text" placeholder="http://localhost:5000" />
  <label>👤 Name (Urheber im Journal)</label>
  <input id="actor" type="text" placeholder="dein Name" />
  <label>🔑 API-Token <span class="muted">(journali → ⚙ Einstellungen → Konto; nötig, sobald es Benutzer gibt)</span></label>
  <input id="token" type="password" placeholder="jt_…" autocomplete="off" />
  <label>🔍 Knoten</label>
  <input id="q" type="search" placeholder="Name, SKU, Id — ab 2 Zeichen" autocomplete="off" />
  <div id="hits" class="hits" hidden></div>
  <div id="picked" class="muted"></div>
  <div class="row">
    <div style="flex:1"><label>Zeilen</label>
      <select id="mode"><option value="children">Subitems</option><option value="variants">alle Varianten darunter</option><option value="products">alle Produkte darunter</option></select></div>
    <div style="flex:1"><label>Sprache</label><select id="locale"></select></div>
  </div>
  <label>Spalten (Sicht)</label>
  <select id="view"><option value="">◫ alle Attribute</option></select>
  <div class="row">
    <button id="load" class="primary" disabled>⇩ ins Blatt laden</button>
    <button id="save" disabled>💾 Geändertes speichern</button>
    <button id="reload" disabled title="Blatt neu laden — eigene Änderungen gehen verloren">↻</button>
  </div>
  <div class="muted" style="margin-top:8px">Zeile 1 = Schlüssel (nicht ändern), Zeile 2 = Namen, Spalte A = Id. <i>Kursiv</i> = geerbt. Speichern schreibt nur Zellen, die sich seit dem Laden geändert haben — als ein Stapel. Der Schnappschuss liegt im versteckten Blatt _journali.</div>
  <div id="log" class="log"></div>
  <script src="plugin.js"></script>
</body>
</html>
