# Image in die Container-Registry der Gitea: bei jedem Push auf master als `latest` und `sha-<kurz>`. Gitea Actions liest
# .gitea/workflows vor .github/workflows — der GitHub-Workflow (ghcr.io) läuft hier nicht. Adresse und Besitzer kommen aus
# der Gitea selbst (GITHUB_SERVER_URL, GITHUB_REPOSITORY_OWNER), im Repo steht keine eigene Adresse.
# Braucht: einen Runner mit Docker (act_runner, der Docker-Socket wird in den Job gereicht) und das Geheimnis
# REGISTRY_TOKEN (Zugangstoken mit write:package) — docs/betrieb.md → Unraid.
name: docker
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bauen und in die Registry der Gitea
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -eu
          host="${GITHUB_SERVER_URL#*://}"; host="${host%/}"
          bild="$host/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/journali"
          echo "$REGISTRY_TOKEN" | docker login "$host" -u "$GITHUB_ACTOR" --password-stdin
          docker build --pull -t "$bild:latest" -t "$bild:sha-${GITHUB_SHA:0:7}" .
          docker push "$bild:latest"
          docker push "$bild:sha-${GITHUB_SHA:0:7}"
          docker image rm "$bild:sha-${GITHUB_SHA:0:7}" || true
          echo "Image: $bild:latest"
