# Image in die Container-Registry der Gitea: bei jedem Push auf master als `latest` und `sha-<kurz>`. Gitea Actions liest
# .gitea/workflows vor .github/workflows — der GitHub-Workflow (ghcr.io) läuft hier nicht.
#
# Der Job läuft im Image docker:cli, der Docker-Socket des Hosts ist hineingereicht (Runner-Einstellung): `docker build`
# und `docker push` führt also der Docker des Servers aus. Daher zwei Adressen für dieselbe Gitea:
#   git clone  — GITHUB_SERVER_URL, so wie der Job-Container sie sieht
#   Registry   — 127.0.0.1:<Port>, so wie der Docker des Hosts sie sieht; ohne https nimmt Docker nur localhost an
# Keine JS-Aktionen (kein actions/checkout): docker:cli bringt kein Node mit. Einrichtung: docs/betrieb.md → Unraid.
name: docker
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: bauen und in die Registry der Gitea
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GITEA_TOKEN }}
        run: |
          set -eu
          gitea="${GITHUB_SERVER_URL%/}"
          registry="127.0.0.1:${gitea##*:}"
          besitzer=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          bild="$registry/$besitzer/journali"
          auth=$(printf '%s:%s' "$GITHUB_ACTOR" "$TOKEN" | base64 -w0)
          git -c http.extraheader="Authorization: Basic $auth" clone --depth 1 -b "$GITHUB_REF_NAME" "$gitea/$GITHUB_REPOSITORY.git" quelle
          cd quelle
          echo "$TOKEN" | docker login "$registry" -u "$GITHUB_ACTOR" --password-stdin
          docker build --pull -t "$bild:latest" -t "$bild:sha-${GITHUB_SHA:0:7}" .
          docker push "$bild:latest"
          docker push "$bild:sha-${GITHUB_SHA:0:7}"
          docker image rm "$bild:sha-${GITHUB_SHA:0:7}" || true
          echo "Image: $bild:latest"
