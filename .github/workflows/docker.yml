# Image nach ghcr.io/journalipim/journali: bei jedem Push auf master als `latest` (und `sha-<kurz>`),
# bei einem Tag v1.2.3 zusätzlich als `1.2.3`, `1.2` und `1`. Gebaut wird das Dockerfile im Repo, das die
# Oberfläche und die Hilfe selbst baut; Ergebnis ist das autarke Laufzeit-Image (docs/betrieb.md → Verteilen).
# Das Paket auf ghcr.io ist so sichtbar wie das Repo; für `docker pull` ohne Anmeldung muss es öffentlich sein.
name: docker
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
